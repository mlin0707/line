<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>line </title>
    <link rel="stylesheet" href="style.css">

</head>
<body>
    <div id="main-layout">
        <canvas id="gameSurface"></canvas>

        <div id="side-column">
            <div id="data-display">
                <h2 class="panel-title">Data</h2>
                <div class="data-row">
                    <span class="data-label">Abstand</span>
                    <span class="data-value" id="distance">-</span>
                </div>
                <div class="data-row">
                    <span class="data-label">Durchschnittsabstand</span>
                    <span class="data-value" id="avargeDistance">-</span>
                </div>
            </div>

            <div id="button-panel">
                <h2 class="panel-title">Controls</h2>
                <select class="panel-btn" id="levelSelect" ></select>
                <button class="panel-btn" id="startMouseTrackingBtn">start tracking</button>
                <button class="panel-btn" id="resetDataBtn">reset Data</button>
                <button class="panel-btn" id="createLevelBtn">create Level</button>

            </div>
        </div>
    </div>

   <script src="script.js" ></script>
</body>

</html>
